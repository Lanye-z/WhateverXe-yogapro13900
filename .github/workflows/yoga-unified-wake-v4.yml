name: Yoga 0.8.3 V4 First-Wake R4 (EXPERIMENT)
on:
  push:
    branches: [experiment/wex-0.8.3-yoga-hdmi2-wake-v4]
    paths: ['wexwakev4/**', '.github/workflows/yoga-unified-wake-v4.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: b00t0x/WhateverXe
          ref: f26a36880c49ea1063393d943527808c0f38feca
          path: Source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: b00t0x/WhateverXe-Graphics
          ref: cf0a21841d0464dd0b0e9c5b1db28d47137a6832
          path: Graphics
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 05094e5e88cec7caedbfb35e8449ed0db94bf95b
          path: MacKernelSDK
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/Lilu
          ref: 1.7.2
          path: Lilu
          persist-credentials: false
      - name: Prepare V3 + Unified RC1 + V4 wake source, fail-closed guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          python3 -m py_compile wexsst/prepare.py wexsst/test_patch.py wexdpdiag/prepare.py wex600/prepare_hdmi600_observe.py wex600/diagnose.py wexedid/prepare_edid_ab.py
          bash -n wex600/collect.sh
          clang++ -std=c++17 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all \
            -I e11 e11/tools/test_hdmi600.cpp -o /tmp/yoga_hdmi600_test
          /tmp/yoga_hdmi600_test
          clang++ -std=c++17 -O1 -Wall -Wextra -Werror \
            -I wexedid wexedid/test_edid_ab.cpp -o /tmp/yoga_edid_deep8_test
          /tmp/yoga_edid_deep8_test
          clang++ -std=c++17 -O1 -Wall -Wextra -Werror \
            -I wexrgb wexrgb/test_policy.cpp -o /tmp/yoga_color_policy_test
          /tmp/yoga_color_policy_test
          python3 -m py_compile wexhdmi2/prepare.py wexhdmi2v2/prepare.py
          python3 wexhdmi2v2/prepare.py Source Graphics
          python3 wexsst/test_patch.py Source
          grep -Fq -- 'checkKernelArgument("-wex-yoga-hdmi2-callsite-safe")' Source/WhateverXe/kern_xe.cpp
          grep -Fq -- 'checkKernelArgument("-wex-yoga-hdmi2-callsite-observe")' Source/WhateverXe/kern_xe.cpp
          grep -Fq -- 'WEXYogaHDMI2SourceLast' Source/WhateverXe/kern_xe.cpp
          grep -Fq -- 'XE::yogaHDMI2Callsite' Source/WhateverXe/kern_xe.cpp
          grep -Fq -- 'const uint32_t status=55' Source/WhateverXe/kern_xe.cpp
          python3 wexhdmi2v2/test_plan.py
          python3 wexhdmi2v2/test_scdc_gmbus_wait.py
          grep -Fq -- 'hdmi2_scdc_prepare.hpp' Source/WhateverXe/kern_yoga_hdmi2_candidate.hpp
          test -s Source/WhateverXe/kern_yoga_hdmi2_candidate.hpp
          test -s Source/WhateverXe/kern_display13_hdmi_caps.hpp
          test -f Source/WhateverXe/kern_yoga_hdmi_edid_ab.hpp
          test -f Source/WhateverXe/kern_yoga_hdmi600.hpp
          grep -Fq 'checkKernelArgument("-wex-yoga-hdmi-edid-deep8")' Source/WhateverXe/kern_xe.cpp
          grep -Fq 'checkKernelArgument("-wex-yoga-hdmi600")' Source/WhateverXe/kern_xe.cpp
          grep -Fq '"WEXYogaHDMIEDIDABApplied"' Source/WhateverXe/kern_xe.cpp
          grep -Fq '"WEXYogaHDMI600Status"' Source/WhateverXe/kern_xe.cpp
          ! grep -Fq 'checkKernelArgument("-wex-yoga-hdmi4k60")' Source/WhateverXe/kern_xe.cpp
          grep -Fq 'checkKernelArgument("-wex-yoga-usbc-dpdiag")' Source/WhateverXe/kern_xe.cpp
          grep -Fq '"WEXYogaUSBCDPTrainingLast"' Source/WhateverXe/kern_xe.cpp
          grep -Fq '"WEXYogaUSBCDPStopDetail"' Source/WhateverXe/kern_xe.cpp
          python3 - <<'PY'
          from pathlib import Path
          s=Path("Source/WhateverXe/kern_xe.cpp").read_text()
          assert s.count('WEXYogaUSBCDPTrainingLast')==1
          assert s.count('WEXYogaUSBCDPStopDetail')==1
          assert s.count('yogaUSBCDPDiagSnapshot(void *controller')==1
          assert 'orgDisplay13HDMI2TMDS' not in s
          assert 'WEXYogaHDMI2TMDSRouteStatus' not in s
          assert '-wex-yoga-hdmi2-link' not in s
          assert s.count("KernelPatcher::RouteRequest route(sym,wrapDisplay13DPCDInfo,orgDisplay13DPCDInfo);")==1
          assert s.count("WEXYogaSSTHookStatus")==1
          assert "checkKernelArgument(\"-wex-yoga-tc5-sst\")" in s
          print("PASS DDI5-only opt-in native DPCD hook, no HDMI2 interference")
          PY
          python3 -m py_compile wexintegrated/prepare_unified.py
          python3 wexintegrated/prepare_unified.py --self-test
          python3 wexintegrated/prepare_unified.py Source
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path("Source/WhateverXe/kern_xe.cpp").read_text()
          a=json.loads(Path("Source/tests/fixtures/boot_argument_names.json").read_text())
          disabled=[
              "-wex-yoga-disable-integrated",
              "-wex-yoga-disable-edp120-admit",
              "-wex-yoga-disable-edp120-wm",
              "-wex-yoga-disable-hdmi-deep8",
              "-wex-yoga-disable-hdmi600",
              "-wex-yoga-disable-tc5-sst",
          ]
          assert all(k in a and 'checkKernelArgument("'+k+'")' in s for k in disabled)
          assert 'yogaHDMI2SafeRequested=checkKernelArgument("-wex-yoga-hdmi2-callsite-safe");' in s
          assert 'patcher.routeBlock(address+callOffset,patchedCall,sizeof(patchedCall));' in s
          assert 'WEXYogaSSTHookStatus' in s and 'WEXYogaHDMIEDIDABApplied' in s
          for old in ["-wex-yoga-edp120-admit","-wex-yoga-edp120-wm",
                      "-wex-yoga-hdmi-edid-deep8","-wex-yoga-hdmi600",
                      "-wex-yoga-tc5-sst"]:
              assert old not in a
              assert 'checkKernelArgument("'+old+'")' not in s
          print("PASS unified default-on guards, disable switches, HDMI2 V3 still opt-in")
          PY
          python3 -m py_compile wexwakev4/prepare.py wexwakev4/prepare_powerwake.py wexwakev4/prepare_session_r3.py wexwakev4/prepare_nativewake_r4.py wexwakev4/test_source.py
          clang++ -std=c++17 -Wall -Wextra -Werror -O1 \
            -I wexwakev4 wexwakev4/test_wake_policy.cpp -o /tmp/yoga_wake_policy
          /tmp/yoga_wake_policy
          clang++ -std=c++17 -Wall -Wextra -Werror -O1 \
            -I wexwakev4 wexwakev4/test_session_policy.cpp -o /tmp/yoga_session_policy
          /tmp/yoga_session_policy
          python3 wexwakev4/prepare.py Source
          python3 wexwakev4/prepare_powerwake.py Source
          python3 wexwakev4/prepare_session_r3.py Source
          python3 wexwakev4/prepare_nativewake_r4.py Source
          python3 wexwakev4/test_source.py
          python3 wexhdmi2v2/test_plan.py
          python3 wexhdmi2v2/test_scdc_gmbus_wait.py
          git -C Source diff --check
          mkdir -p Source/Lilu.kext/Contents/Resources
          ln -s "$GITHUB_WORKSPACE/Lilu/Lilu/Headers" Source/Lilu.kext/Contents/Resources/Headers
          ln -s "$GITHUB_WORKSPACE/Lilu/Lilu/Library" Source/Lilu.kext/Contents/Resources/Library
      - name: Build RELEASE and verify Compat
        shell: bash
        working-directory: Source
        run: |
          set -euo pipefail
          python3 tools/build.py --release --sdk "$GITHUB_WORKSPACE/MacKernelSDK" --output build/RELEASE
          python3 tools/check_compat_version.py build/RELEASE
      - name: Original WhateverXe 0.8.3 regression suite
        working-directory: Source
        run: python3 tools/test.py
      - name: Package V4 wake research test build (default V4 off)
        shell: bash
        run: |
          set -euo pipefail
          KEXT=Source/build/RELEASE/WhateverXe.kext
          test -s "$KEXT/Contents/MacOS/WhateverXe"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$KEXT/Contents/Info.plist" | grep -qx '0.8.3'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$KEXT/Contents/Info.plist" | grep -qx 'org.b00t0x.WhateverXe'
          mkdir -p dist
          ditto -c -k --keepParent "$KEXT" dist/WhateverXe_0.8.3_YOGA_UNIFIED_WAKE_V4_FIRSTWAKE_R4_TEST.zip
          git -C Source diff -- WhateverXe tests/fixtures/boot_argument_names.json > dist/EXACT_PATCH.diff
          grep -Fq -- '-wex-yoga-hdmi2-callsite-safe' dist/EXACT_PATCH.diff
          grep -Fq -- '-wex-yoga-hdmi2-callsite-observe' dist/EXACT_PATCH.diff
          strings "$KEXT/Contents/MacOS/WhateverXe" | grep -F -- '-wex-yoga-hdmi2-callsite-safe' > /dev/null
          strings "$KEXT/Contents/MacOS/WhateverXe" | grep -F -- '-wex-yoga-hdmi2-callsite-observe' > /dev/null
          strings "$KEXT/Contents/MacOS/WhateverXe" | grep -F -- 'WEXYogaHDMI2SourceLast' > /dev/null
          strings "$KEXT/Contents/MacOS/WhateverXe" | grep -F -- 'WEXYogaHDMI2WakeRecoverEnabled' > /dev/null
          strings "$KEXT/Contents/MacOS/WhateverXe" | grep -F -- '-wex-yoga-hdmi2-wake-recover' > /dev/null
          strings "$KEXT/Contents/MacOS/WhateverXe" | grep -F -- 'WEXYogaHDMI2WakeLast' > /dev/null
          strings "$KEXT/Contents/MacOS/WhateverXe" | grep -F -- 'WEXYogaHDMI2WakePowerLast' > /dev/null
          strings "$KEXT/Contents/MacOS/WhateverXe" | grep -F -- 'WEXYogaHDMI2WakeActionLast' > /dev/null
          strings "$KEXT/Contents/MacOS/WhateverXe" | grep -F -- 'WEXYogaHDMI2WakeRejectLast' > /dev/null
          strings "$KEXT/Contents/MacOS/WhateverXe" | grep -F -- 'WEXYogaHDMI2CallsiteHist%02u' > /dev/null
          strings "$KEXT/Contents/MacOS/WhateverXe" | grep -F -- 'WEXYogaHDMI2WakePowerHist%02u' > /dev/null
          cp wexwakev4/README.md dist/README.md
          cp wex4k60/compare.py dist/compare.py
          cp wex4k60/collect.sh dist/collect.sh
          cp Source/build/RELEASE/build-manifest.json dist/
          (cd dist && shasum -a 256 WhateverXe*.zip > SHA256SUMS)
          unzip -t dist/WhateverXe_0.8.3_YOGA_UNIFIED_WAKE_V4_FIRSTWAKE_R4_TEST.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Yoga-0.8.3-UNIFIED-WAKE-V4-FIRSTWAKE-R4-TEST
          path: dist/*
          retention-days: 30
          if-no-files-found: error
