name: Inspect GMBUS SCDC exact source safely
on:
  push:
    branches: [experiment/wex-0.8.3-yoga-hdmi2-link-safe]
    paths: ['.github/workflows/yoga-hdmi2-gmbus-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: b00t0x/WhateverXe
          ref: f26a36880c49ea1063393d943527808c0f38feca
      - name: Print exact native GMBUS context only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('WhateverXe/kern_xe.cpp').read_text().splitlines()
          for a,b in [(4567,4620),(7690,7810),(7216,7330)]:
              print('\n===== SOURCE LINES',a,'..',b,'=====')
              for i in range(a-1,b):print(f'{i+1:05d} {lines[i]}')
          PY
