name: Yoga DDI5 targeted native mock compilation
on:
  push:
    branches: [experiment/wex-0.8.3-yoga-usbc-dp-failure-diag]
    paths: ['.github/workflows/yoga-usbc-dpdiag-smoke.yml']
permissions:
  contents: read
jobs:
  mock:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: b00t0x/WhateverXe
          ref: f26a36880c49ea1063393d943527808c0f38feca
          path: Source
      - uses: actions/checkout@v4
        with:
          repository: b00t0x/WhateverXe-Graphics
          ref: cf0a21841d0464dd0b0e9c5b1db28d47137a6832
          path: Graphics
      - name: Prepare production source without extra hooks
        run: python3 wexdpdiag/prepare.py Source Graphics
      - name: Compile and run exact TGL training fixture with explicit error output
        run: |
          python3 Source/tests/tgl_training_leases.py
      - name: Compile and run exact Display13 frontend fixture
        run: python3 Source/tests/display13_training_frontend.py
