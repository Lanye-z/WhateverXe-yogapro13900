name: Yoga ColorPolicy x86_64 RELEASE cross-build on macOS ARM64
on:
  push:
    branches: [experiment/wex-0.8.3-yoga-hdmi-colorpolicy]
    paths: ['.github/workflows/yoga-hdmi-colorpolicy-cross.yml']
  pull_request:
    branches: [experiment/wex-0.8.3-yoga-hdmi-colortrace]
    paths: ['.github/workflows/yoga-hdmi-colorpolicy-cross.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crossbuild:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: b00t0x/WhateverXe
          ref: f26a36880c49ea1063393d943527808c0f38feca
          path: Source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: b00t0x/WhateverXe-Graphics
          ref: cf0a21841d0464dd0b0e9c5b1db28d47137a6832
          path: Graphics
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 05094e5e88cec7caedbfb35e8449ed0db94bf95b
          path: MacKernelSDK
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/Lilu
          ref: 1.7.2
          path: Lilu
          persist-credentials: false
      - name: Prepare pinned source and platform-independent tests
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          python3 -m py_compile wexcolor/prepare_colortrace.py wexcolor/decode_color.py wexcolor/test_decoder.py
          python3 wexcolor/test_decoder.py
          python3 -m py_compile wexrgb/prepare_policy.py wexrgb/decode_modes.py wexrgb/test_mode_decoder.py
          python3 wexrgb/test_mode_decoder.py
          clang++ -std=c++17 -Wall -Wextra -Werror -I wexrgb wexrgb/test_policy.cpp -o "$RUNNER_TEMP/test_yoga_color_policy"
          "$RUNNER_TEMP/test_yoga_color_policy"
          python3 wexrgb/prepare_policy.py Source Graphics
          mkdir -p Source/Lilu.kext/Contents/Resources
          ln -s "$GITHUB_WORKSPACE/Lilu/Lilu/Headers" Source/Lilu.kext/Contents/Resources/Headers
          ln -s "$GITHUB_WORKSPACE/Lilu/Lilu/Library" Source/Lilu.kext/Contents/Resources/Library
      - name: Compile x86_64 RELEASE Kext with macOS cross-toolchain
        shell: bash
        working-directory: Source
        run: |
          set -euo pipefail
          python3 tools/build.py --release --sdk "$GITHUB_WORKSPACE/MacKernelSDK" --output build/RELEASE
          python3 tools/check_compat_version.py build/RELEASE
          file build/RELEASE/WhateverXe.kext/Contents/MacOS/WhateverXe
          file build/RELEASE/WhateverXe.kext/Contents/MacOS/WhateverXe | grep -qi 'x86_64'
      - name: Package cross-compiled x86_64 test Kext and record source diff
        shell: bash
        run: |
          set -euo pipefail
          KEXT=Source/build/RELEASE/WhateverXe.kext
          test -s "$KEXT/Contents/MacOS/WhateverXe"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$KEXT/Contents/Info.plist" | grep -qx '0.8.3'
          mkdir -p dist
          ditto -c -k --keepParent "$KEXT" dist/WhateverXe_0.8.3_WMONLY_HDMIColorPolicy_x86_64_CROSS_TEST.zip
          git -C Source diff -- WhateverXe tests/fixtures/boot_argument_names.json > dist/PATCH.diff
          cp wexrgb/README.md dist/README.md
          cp wexrgb/collect_policy.sh dist/collect_policy.sh
          cp wexrgb/decode_modes.py dist/decode_modes.py
          cp wexcolor/decode_color.py dist/decode_color.py
          cp Source/build/RELEASE/build-manifest.json dist/
          (cd dist && shasum -a 256 WhateverXe*.zip > SHA256SUMS)
          unzip -t dist/WhateverXe_0.8.3_WMONLY_HDMIColorPolicy_x86_64_CROSS_TEST.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WhateverXe-0.8.3-WMONLY-HDMI-ColorPolicy-x86_64-CROSS-TEST
          path: dist/*
          retention-days: 30
          if-no-files-found: error
