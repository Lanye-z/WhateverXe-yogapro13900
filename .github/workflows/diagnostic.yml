name: D1.1 - source build and video compile (no patches)
on:
  push:
    branches: [D1.1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-build:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: b00t0x/WhateverXe
          ref: d0b7fb6275ca51fde088fa7e91595462bd457ec9
          path: Source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 05094e5e88cec7caedbfb35e8449ed0db94bf95b
          path: MacKernelSDK
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/Lilu
          ref: 1.7.2
          path: Lilu
          persist-credentials: false
      - name: Copy complete C++ sources (no patch application)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C Source rev-parse HEAD)" = d0b7fb6275ca51fde088fa7e91595462bd457ec9
          for f in WhateverXe/kern_alderlake_n.hpp WhateverXe/kern_xe.cpp tests/adlp_fb_candidate.py tests/fixtures/boot_argument_names.json; do
            test -s "src/$f"
            cp "src/$f" "Source/$f"
          done
          git -C Source diff --check
          grep -Fq 'checkKernelArgument("-wex-a7a0-panel-only")' Source/WhateverXe/kern_xe.cpp
          mkdir -p Source/Lilu.kext/Contents/Resources
          ln -s "$GITHUB_WORKSPACE/Lilu/Lilu/Headers" Source/Lilu.kext/Contents/Resources/Headers
          ln -s "$GITHUB_WORKSPACE/Lilu/Lilu/Library" Source/Lilu.kext/Contents/Resources/Library
      - name: Official source tests
        working-directory: Source
        run: python3 tools/test.py
      - name: Build RELEASE kext
        working-directory: Source
        run: |
          python3 tools/build.py --release --sdk "$GITHUB_WORKSPACE/MacKernelSDK" --output build/RELEASE
          python3 tools/check_compat_version.py build/RELEASE
      - name: Compile-only VideoToolbox regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n macos/video-encode/*.command build_D_on_macos.command
          clang -std=c11 -Wall -Wextra -Werror tests/test_bgra_nv12.c -o /tmp/wex_bgra_unit
          /tmp/wex_bgra_unit
          for src in wex_bgra_compat_encode.m wex_encoder_inventory.m wex_hevc_discovery_probe.m wex_vphal_transfer_probe.m; do
            xcrun clang -arch x86_64 -fobjc-arc -Wall -Wextra -Wno-unused-parameter -framework Foundation -framework VideoToolbox -framework CoreVideo -framework CoreMedia "macos/video-encode/$src" -o "/tmp/${src%.m}"
          done
      - name: Single artifact with upstream Graphics version manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          ditto -c -k --keepParent Source/build/RELEASE/WhateverXe.kext dist/WhateverXe-D1.1-EXPERIMENTAL.zip
          unzip -t dist/WhateverXe-D1.1-EXPERIMENTAL.zip
          cp graphics/BASELINE.md dist/GRAPHICS-BASELINE.md
          cp Source/build/tests/results.json dist/source-tests.json
          (cd dist && shasum -a 256 WhateverXe-D1.1-EXPERIMENTAL.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: WhateverXe-D1.1-Source-GraphicsManifest
          path: dist/*
          if-no-files-found: error
