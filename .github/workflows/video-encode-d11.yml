name: D1.1 video diagnostics - macOS compile + pure C tests

on:
  push:
    branches: [D1.1]
    paths:
      - 'macos/video-encode/**'
      - 'tests/test_bgra_nv12.c'
      - '.github/workflows/video-encode-d11.yml'
  pull_request:
    paths:
      - 'macos/video-encode/**'
      - 'tests/test_bgra_nv12.c'
      - '.github/workflows/video-encode-d11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-only:
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        shell: bash
        run: bash -n macos/video-encode/*.command
      - name: Portable CPU conversion tests
        shell: bash
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror tests/test_bgra_nv12.c -o /tmp/wex_bgra_nv12_unit
          /tmp/wex_bgra_nv12_unit
      - name: Compile new native VideoToolbox probes (no driver execution)
        shell: bash
        run: |
          set -euo pipefail
          for src in wex_hevc_discovery_probe.m wex_vphal_transfer_probe.m; do
            xcrun clang -arch x86_64 -O1 -fobjc-arc -Wall -Wextra -Wno-unused-parameter \
              -framework Foundation -framework VideoToolbox -framework CoreVideo -framework CoreMedia \
              "macos/video-encode/$src" -o "/tmp/${src%.m}"
            file "/tmp/${src%.m}"
          done
      - name: Validate VPHAL byte-guard geometry and strict source gates
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p 'test_vphal_guard_offline.py' -v
          python3 -m py_compile macos/video-encode/vphal_guard_offline.py macos/video-encode/hevc_va_static_audit.py
      - name: Never perform native driver initialization in CI
        shell: bash
        run: |
          echo 'Success here proves syntax/build only. No HEVC hardware encoder or VPHAL runtime assertions.'
